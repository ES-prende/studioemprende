name: Construir y publicar en IONOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Construir la web
        run: python generador/construir.py marca web portadas

      - name: Instalar lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Subir a IONOS por SFTP (solo cambios)
        env:
          HOST: ${{ secrets.SFTP_HOST }}
          USER: ${{ secrets.SFTP_USER }}
          PASS: ${{ secrets.SFTP_PASSWORD }}
          RUTA: ${{ secrets.SFTP_PATH }}
        run: |
          lftp -e "set sftp:auto-confirm yes; set net:max-retries 3; mirror -R --verbose --exclude-glob .git* web/ ${RUTA:-/}; bye" -u "$USER","$PASS" sftp://$HOST

      - name: Avisar a IndexNow (Bing, Yandex...) de las paginas nuevas o modificadas
        env:
          ANTES: ${{ github.event.before }}
        run: python generador/scripts/indexnow.py
